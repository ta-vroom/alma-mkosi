# Bootable Ubuntu Disk Image Profile
#
# Produces a GPT disk image that can be booted in qemu or
# written to a USB drive with `mkosi burn /dev/sdX`.
#
# Build with: mkosi --profile bootable
# Boot with:  mkosi --profile bootable vm
#             mkosi --profile bootable boot

[Output]
Format=disk

[Content]
Bootable=yes
# For Debian/Ubuntu, systemd-boot requires the systemd-boot-efi package
Packages=
        linux-image-generic
        systemd-boot-efi
        openssh-server
        openssh-client
