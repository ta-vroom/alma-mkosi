# Ubuntu Desktop Profile
#
# Includes GNOME desktop environment and common desktop applications.
# Build with: mkosi --profile desktop
#
# Note: This produces a large image. Consider using Format=disk
# for bootable desktop images.

[Distribution]
Repositories=universe,multiverse

[Output]
Format=directory

[Content]
Packages=
        ubuntu-desktop-minimal
        gnome-terminal
        firefox
        fonts-ubuntu
        pulseaudio
