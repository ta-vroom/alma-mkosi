[Partition]
Type=root
Format=erofs
Label=root_a_%A
ReadOnly=yes
Verity=data
VerityMatchKey=root

# Tell systemd-repart to populate the filesystem from the mkosi rootfs tree
CopyFiles=/

# Sizing
SizeMinBytes=500M
SizeMaxBytes=2G

MakeSymlinks=/home:var/home
MakeSymlinks=/root:var/roothome
MakeSymlinks=/opt:var/opt
MakeSymlinks=/srv:var/srv
MakeSymlinks=/usr/local:var/usrlocal