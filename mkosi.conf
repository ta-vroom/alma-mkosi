[Output]
OutputDirectory=mkosi.output

[Distribution]
Distribution=fedora
Release=44
#Repositories=epel

[Build]
Environment='SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-z lz4hc'

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=alma
SplitArtifacts=yes

[Config]
Dependencies=initrd

[Content]
RootPassword=root
Bootable=true
SELinuxRelabel=yes
Packages=
    kernel
    systemd
    coreutils
    util-linux
    systemd-libs
    systemd-pam
    systemd-udev
    systemd-boot
    systemd-boot-unsigned
    systemd-ukify
    systemd-networkd
    systemd-networkd-defaults
    systemd-resolved
    # This is needed for sd-sysupdate to pull updates
    systemd-container
    dbus
    openssh
    openssh-server
    podman
    cryptsetup
    firewalld
    iproute
    iputils
    curl
    libcurl-minimal
    vim
    nano
    less
    selinux-policy-targeted
    policycoreutils
    libselinux-utils
    fish
    bat
    container-selinux
RemovePackages=
    dnf
    dnf-data
    dnf-plugins-core
    yum
    dracut
KernelCommandLine=
    logo.nologo
    systemd.machine_id=firmware
    lsm=selinux
    enforcing=0
    console=ttyS0,115200n8
    rd.systemd.break=pre-mount
    rd.systemd.debug_shell
    rd.systemd.default_debug_tty=ttyS0
    rd.debug systemd.log_level=debug
    systemd.log_target=console
CleanPackageMetadata=yes
Locale=C.UTF-8
WithDocs=no