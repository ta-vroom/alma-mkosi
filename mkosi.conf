[Distribution]
Distribution=alma
Release=10
Repositories=epel

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=alma
# SplitArtifacts belongs under [Output]
SplitArtifacts=yes

[Content]
Bootable=true
Bootloader=systemd-boot
Packages=
    kernel
    systemd
    systemd-udev
    dbus
    podman
    
    systemd-networkd