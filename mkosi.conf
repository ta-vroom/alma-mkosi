[Output]
OutputDirectory=mkosi.output

[Distribution]
Distribution=arch
# Release=44
#Repositories=epel

[Build]
Environment='SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-z lz4hc'

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=alma
SplitArtifacts=uki,partitions
CompressOutput=zstd
CompressLevel=4
Output=%i_%v_%a

[Config]
# Dependencies=initrd

[Content]
# Initrds=%O/initrd_%v_%a
UnifiedKernelImageFormat=%i_%v_%a
Hostname=particle
RootPassword=root
Bootable=true
Packages=
    # Core & Kernel
    linux
    kmod
    coreutils
    util-linux
    ca-certificates
    e2fsprogs
    xfsprogs
    procps-ng
    dosfstools
    efibootmgr

    # Systemd & UKI
    systemd
    systemd-ukify

    # Security & Storage
    cryptsetup
    firewalld

    # Networking & Access
    iproute2
    iputils
    wireguard-tools
    openssh
    curl

    # Containers & IPC
    dbus-broker
    podman

    # Utilities
    bat
    fish
    jq
    less
    nano
    tar
    unzip
    vim
    zip
    zstd
    sbctl
VolatilePackages=
        systemd
        udev
# RemovePackages=
#     dnf
#     dnf-data
#     dnf-plugins-core
#     yum
#     dracut
KernelCommandLine=
    logo.nologo
    systemd.machine_id=firmware
    lsm=selinux
    enforcing=0
    console=ttyS0,115200n8
    rd.systemd.break=pre-mount
    rd.systemd.debug_shell
    rd.systemd.default_debug_tty=ttyS0
    rd.debug systemd.log_level=debug
    systemd.log_target=console
CleanPackageMetadata=yes
Locale=C.UTF-8
WithDocs=no