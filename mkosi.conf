[Distribution]
Distribution=alma
Release=10

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=alma

[Content]
Bootable=true
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
SplitArtifacts=yes
Packages=
        systemd
        systemd-udev
        dbus
        podman
        systemd-networkd