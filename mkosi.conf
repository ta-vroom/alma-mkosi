[Distribution]
Distribution=alma
Release=10
Repositories=epel

[Output]
Format=disk
Bootable=true
OutputDirectory=mkosi.output
ImageId=alma
SplitArtifacts=yes

[Runtime]
RootPassword=root

[Content]
Packages=
    kernel
    systemd
    systemd-udev
    systemd-boot
    systemd-boot-unsigned
    systemd-ukify
    systemd-networkd
    dbus
    podman
    cryptsetup
    firewalld
RemovePackages=
    dnf
    dnf-data
    dnf-plugins-core
    rpm
    yum
CleanPackageMetadata=yes
Locale=C.UTF-8
WithDocs=no