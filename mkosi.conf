[Distribution]
Distribution=fedora
Release=44
# Repositories=epel

[Output]
Format=disk
Bootable=true
OutputDirectory=mkosi.output
ImageId=alma
# SplitArtifacts belongs under [Output]
SplitArtifacts=yes

[Content]
Packages=
    kernel
    systemd
    systemd-udev
    dbus
    podman
    systemd-boot
    systemd-boot-unsigned
    systemd-ukify
    systemd-networkd

[Partitions]
RootSize=3G
ESPSize=256M