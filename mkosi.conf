[Distribution]
Distribution=alma
Release=10
Repositories=epel

[Build]
Environment='SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-z lz4hc'

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=iota
SplitArtifacts=uki,partitions
CompressOutput=zstd
CompressLevel=4
Output=%i_%v_%a

[Config]
Dependencies=initrd

[Content]
Initrds=%O/initrd_%v_%a
UnifiedKernelImageFormat=%i_%v_%a
Hostname=iota
RootPassword=root
Bootable=true
SELinuxRelabel=yes
Packages=
    # Core & Kernel
    kernel
    kmod
    rpm
    coreutils
    util-linux
    ca-certificates
    e2fsprogs
    xfsprogs
    procps-ng
    dosfstools
    efibootmgr

    # Systemd & UKI Infrastructure
    systemd-udev
    systemd-boot-unsigned
    systemd-ukify
    systemd-networkd
    systemd-networkd-defaults
    systemd-resolved
    systemd-container

    # Security, SELinux & Firewalls
    checkpolicy
    cryptsetup
    firewalld
    container-selinux
    libselinux-utils
    policycoreutils
    selinux-policy-targeted

    # Networking & Remote Access
    iproute
    iputils
    wireguard-tools
    openssh
    openssh-server
    curl

    # Containers & IPC
    dbus-broker
    podman

    # Shell, Editors & Admin Utilities
    bat
    fish
    jq
    less
    nano
    tar
    unzip
    veritysetup
    vim
    zip
    zstd
VolatilePackages=
    systemd
    udev
RemovePackages=
    dnf
    dnf-data
    dnf-plugins-core
    yum
    dracut
KernelCommandLine=
    logo.nologo
    lsm=selinux
CleanPackageMetadata=yes
Locale=C.UTF-8
Timezone=UTC
WithDocs=no