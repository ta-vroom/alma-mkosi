# ubuntu-mkosi - Build Ubuntu Images with mkosi
#
# This is the base configuration for building Ubuntu images.
# Use profiles to customize the image type:
#   mkosi --profile minimal    # Minimal server image
#   mkosi --profile desktop    # Desktop image with GNOME
#   mkosi --profile bootable   # Bootable GPT disk image
#
# Or just run `mkosi` to build a basic Ubuntu directory image.

[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=directory
OutputDirectory=mkosi.output

[Content]
Packages=
        systemd
        udev
        dbus
        networkmanager
        iproute2
        less
        vim-tiny
        sudo
        ca-certificates
        apt-utils
