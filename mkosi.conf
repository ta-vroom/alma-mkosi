[Distribution]
Distribution=alma
Release=10
Repositories=epel

[Output]
Format=disk
Bootable=true
OutputDirectory=mkosi.output
ImageId=alma
# SplitArtifacts belongs under [Output]
SplitArtifacts=yes

[Content]
Packages=
    kernel
    systemd
    systemd-udev
    systemd-boot
    systemd-boot-unsigned
    systemd-ukify
    systemd-networkd
    dbus
    podman
    # Add tools needed for cryptsetup / TPM2 unlocking
    cryptsetup
    systemd-cryptsetup
    tpm2-tools
    tpm2-tss
    libfido2