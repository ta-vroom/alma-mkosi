name: ShellTest

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:
  #push:

jobs:
  cache-test:
    runs-on: ubuntu-26.04
    outputs:
      updates_available: ${{ steps.check_updates.outputs.updates_available }}
      release_notes: ${{ steps.check_updates.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils zstd

      # - name: Check for Upstream Errata
      #   id: check_updates
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     RELEASE_DATE=$(gh release list -L 1 --json publishedAt -q '.[0].publishedAt')
          
      #     if [ -z "$RELEASE_DATE" ] || [ "$RELEASE_DATE" = "null" ]; then
      #       echo "No existing releases found. Forcing build."
      #       echo "needs_build=true" >> "$GITHUB_OUTPUT"
      #       exit 0
      #     fi

      #     SINCE_EPOCH=$(date -d "$RELEASE_DATE" +%s)

      #     LAST_ERRATA=$(curl -s https://errata.almalinux.org/10/errata.full.json \
      #       | jq -r '.data[-1].issued_date')

      #     echo "Last Release Epoch: $SINCE_EPOCH ($(date -d @"$SINCE_EPOCH" -u))"
      #     echo "Last Errata Epoch:  $LAST_ERRATA ($(date -d @"$LAST_ERRATA" -u))"

      #     if [ "$LAST_ERRATA" -gt "$SINCE_EPOCH" ]; then
      #       echo "New errata detected since last image release!"
      #       echo "needs_build=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "Image is newer than the latest published errata. Nothing to do."
      #       echo "needs_build=false" >> "$GITHUB_OUTPUT"
      #     fi
      - name: Inspect Image Updates
        id: check_updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download -R "${{ github.repository }}" -p "alma_*.root-x86-64.*.raw.zst"
          ROOT_ZST=$(find . -maxdepth 1 -name 'alma_*.root-x86-64.*.raw.zst' ! -name '*verity*' | head -n 1)
          if [ -z "$ROOT_ZST" ]; then
            echo "::error::Could not find root partition image in latest release"
            exit 1
          fi

          zstd -d "$ROOT_ZST" -o ./root.raw
          mkdir -p ./mnt
          sudo mount -t erofs -o loop,ro ./root.raw ./mnt

          if [ ! -f ./mnt/usr/lib/sysimage/rpm/rpmdb.sqlite ]; then
            echo "::error::RPM database (/usr/lib/sysimage/rpm/rpmdb.sqlite) not found in image"
            exit 1
          fi

          OS_RELEASE=./mnt/usr/lib/os-release
          [ -f "$OS_RELEASE" ] || OS_RELEASE=./mnt/etc/os-release
          VERSION=$(sed -n 's/^VERSION_ID="\{0,1\}\([0-9]\+\).*/\1/p' "$OS_RELEASE")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine AlmaLinux VERSION_ID from $OS_RELEASE"
            exit 1
          fi

          : > ./release_notes.md

          set +e
          podman run --rm \
            -e VERSION="$VERSION" \
            -v "$PWD/mnt:/installroot:ro" \
            -v "$PWD/release_notes.md:/release_notes.md" \
            -v "$PWD/mkosi.sandbox/etc/yum.repos.d/centos-hyperscale-systemd.repo:/etc/yum.repos.d/centos-hyperscale-systemd.repo:ro" \
            -v "$PWD/mkosi.sandbox/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-SIG-HyperScale:/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-SIG-HyperScale:ro" \
            "almalinux:$VERSION" \
            bash -euo pipefail -c '
              mkdir -p /etc/dnf/vars
              printf "%s-stream\n" "$VERSION" > /etc/dnf/vars/stream
              dnf install -y -q epel-release >/dev/null
              set +e
              COLUMNS=200 dnf check-update --quiet \
                --installroot=/installroot \
                --releasever="$VERSION" \
                --config=/etc/dnf/dnf.conf \
                --setopt=reposdir=/etc/yum.repos.d \
                --setopt=varsdir=/etc/dnf/vars \
                --setopt=cachedir=/var/cache/dnf \
                --setopt=logdir=/var/log \
                --setopt=persistdir=/var/lib/dnf > /tmp/updates.txt
              STATUS=$?
              set -e
              cat /tmp/updates.txt
              if [ "$STATUS" -eq 100 ]; then
                {
                  echo "## Updated Packages"
                  echo ""
                  awk '\''
                    /^Last metadata expiration check:/ { next }
                    /^Obsoleting Packages/ { exit }
                    NF >= 3 && $1 ~ /\./ { print $1, $2, $3 }
                  '\'' /tmp/updates.txt | while read -r pkg new_ver repo; do
                    old_ver=$(rpm --root=/installroot -q --qf "%{EPOCH}:%{VERSION}-%{RELEASE}\n" "$pkg" 2>/dev/null | sed "s/^(none)://" | head -n 1 || true)
                    if [ -n "$old_ver" ]; then
                      echo "- \`$pkg\`: \`$old_ver\` → \`$new_ver\` (\`$repo\`)"
                    else
                      echo "- \`$pkg\`: \`$new_ver\` (\`$repo\`)"
                    fi
                  done
                } > /release_notes.md
              fi
              exit "$STATUS"
            '
          STATUS=$?
          set -e

          if [ $STATUS -eq 100 ]; then
            echo "updates_available=true" >> "$GITHUB_OUTPUT"
            {
              echo "release_notes<<EOF_NOTES"
              cat ./release_notes.md
              echo "EOF_NOTES"
            } >> "$GITHUB_OUTPUT"
            echo "Updates available!"
            cat ./release_notes.md
          elif [ $STATUS -eq 0 ]; then
            echo "updates_available=false" >> "$GITHUB_OUTPUT"
            echo "All packages up to date."
          else
            echo "Check failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Cleanup
        if: always()
        run: |
          if mountpoint -q ./mnt; then
            sudo umount ./mnt
          fi
          rm -f ./root.raw ./release_notes.md alma_*.raw.zst

  build_release:
    needs: cache-test
    if: needs.cache-test.outputs.updates_available == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      release_notes: ${{ needs.cache-test.outputs.release_notes }}
    secrets: inherit