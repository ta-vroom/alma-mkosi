      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnf

      - name: Inspect Image Updates
        id: check_updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ta-vroom/alma-mkosi -p "alma_20260904.112.raw"
          LOOP_DEV=$(sudo losetup -Pf --show alma_20260904.112.raw)

          mkdir -p ./mnt
          sudo mount -o ro "${LOOP_DEV}p2" ./mnt

          # Only get the first two numbers
          VERSION=$(sed -n 's/^VERSION_ID="\{0,1\}\([0-9]\+\)\..*/\1/p' ./mnt/etc/os-release)

          set +e
          podman run --rm --privileged \
            -v "$PWD/mnt:/installroot:ro" \
            almalinux:$VERSION \
            dnf check-update --installroot=/installroot --quiet
          STATUS=$?
          set -e

          if [ $STATUS -eq 100 ]; then
            echo "Updates available!"
          elif [ $STATUS -eq 0 ]; then
            echo "All packages up to date."
          else
            echo "Check failed with exit code $STATUS"
          fi

      - name: Cleanup
        if: always()
        run: |
          if mountpoint -q ./mnt; then
            sudo umount ./mnt
          fi
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d "$LOOP_DEV"
          fi

      - name: Cleanup
        if: always()
        run: |
          if mountpoint -q ./mnt; then
            sudo umount ./mnt
          fi
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d "$LOOP_DEV"
          fi