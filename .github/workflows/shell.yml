      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnf

      - name: Inspect Image Updates
        id: check_updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ta-vroom/alma-mkosi -p "alma_20260904.112.raw"
          
          # Dynamically attach loop device
          LOOP_DEV=$(sudo losetup -Pf --show alma_20260904.112.raw)
          echo "LOOP_DEV=${LOOP_DEV}" >> "$GITHUB_ENV"
          
          mkdir -p ./mnt
          sudo mount "${LOOP_DEV}p2" ./mnt

          # Disable immediate exit to catch return code 100 (updates available)
          set +e
          sudo systemd-nspawn --quiet \
            --volatile=yes \
            -D "$PWD/mnt" \
            dnf check-update --quiet
          STATUS=$?
          set -e

          if [ $STATUS -eq 100 ]; then
            echo "updates_available=true" >> "$GITHUB_OUTPUT"
            echo "Updates found!"
          elif [ $STATUS -eq 0 ]; then
            echo "updates_available=false" >> "$GITHUB_OUTPUT"
            echo "Image is up to date."
          else
            echo "DNF check-update failed with status $STATUS"
            exit $STATUS
          fi

      - name: Cleanup
        if: always()
        run: |
          if mountpoint -q ./mnt; then
            sudo umount ./mnt
          fi
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d "$LOOP_DEV"
          fi

      - name: Cleanup
        if: always()
        run: |
          if mountpoint -q ./mnt; then
            sudo umount ./mnt
          fi
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d "$LOOP_DEV"
          fi