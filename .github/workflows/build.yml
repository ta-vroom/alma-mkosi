name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:
  push:

jobs:
  build-and-chunk:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Registry and Image
        id: image_case
        run: |
          # Extract just the lowercased repository name for Buildah and Push
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Compute Release Tag
        id: vars
        run: |
          # Produces e.g. 2026.08.18-72 or v2026.08.18.72
          echo "RELEASE_TAG=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Install Dependencies
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-boot systemd-repart systemd-ukify python3-pefile binutils mtools dosfstools erofs-utils

      - name: Grab Desync
        run: | 
          gh release download -R folbricht/desync -p "*_linux_amd64.tar.gz" -O - | tar -xzv
          chmod +x desync
          sudo cp desync /usr/local/bin/
          mkdir -p mkosi.extra/usr/local/bin/
          cp desync mkosi.extra/usr/local/bin/
      
      - name: Build OS Image
        run: |
          sudo mkosi build
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This works fine, but there's no easy/official way to do delta updates yet
      # This is by far the cheapest way to host delta updates that I can find, but uploading to the ghcr is finicky, hence the loop.
      # - name: Chunk Images with Desync (with Retries)
      #   run: |
      #     STORE_URL="oci+https://ghcr.io/${{ steps.image_case.outputs.image }}"
          
      #     MAX_RETRIES=5
      #     COUNT=0
          
      #     until desync make -n 4 --store="${STORE_URL}" ./alma.caibx ./mkosi.output/alma.root-x86-64.raw; do
      #       COUNT=$((COUNT+1))
      #       if [ $COUNT -ge $MAX_RETRIES ]; then
      #         echo "Desync failed after $MAX_RETRIES attempts."
      #         exit 1
      #       fi
      #       echo "Chunk upload dropped or timed out. Retrying ($COUNT/$MAX_RETRIES) in 5s..."
      #       sleep 5
      #     done

      #     until desync make -n 4 --store="${STORE_URL}" ./alma_root_verity.caibx ./mkosi.output/alma.root-x86-64-verity.raw; do
      #       COUNT=$((COUNT+1))
      #       if [ $COUNT -ge $MAX_RETRIES ]; then
      #         echo "Desync failed after $MAX_RETRIES attempts."
      #         exit 1
      #       fi
      #       echo "Chunk upload dropped or timed out. Retrying ($COUNT/$MAX_RETRIES) in 5s..."
      #       sleep 5
      #     done

      - name: List directory
        run: |
          ls -la ./mkosi.output

      - name: Rename release files
        run: |
          VER="${{ env.RELEASE_TAG }}"
         
          cp mkosi.output/*.efi "alma_${VER}.efi"
          cp mkosi.output/alma.raw "alma_root-x86-64_${VER}.raw"
          cp mkosi.output/alma.root-x86-64-verity.raw "alma.root-x86-64-verity_${VER}.raw"

          sha256sum "alma_root-x86-64_${VER}.raw" > "alma_root-x86-64_${VER}.raw.sha256"
          sha256sum "alma.root-x86-64-verity_${VER}.raw" > "alma.root-x86-64-verity_${VER}.raw.sha256"
          sha256sum "alma_${VER}.efi" > "alma_${VER}.efi.sha256"

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          prerelease: true
          files: |
            ./alma_${{ env.RELEASE_TAG }}.efi
            ./alma_${{ env.RELEASE_TAG }}.efi.sha256
            ./alma_root-x86-64_${{ env.RELEASE_TAG }}.raw
            ./alma_root-x86-64_${{ env.RELEASE_TAG }}.raw.sha256
            ./alma.root-x86-64-verity_${{ env.RELEASE_TAG }}.raw
            ./alma.root-x86-64-verity_${{ env.RELEASE_TAG }}.raw.sha256