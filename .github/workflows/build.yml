name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:



jobs:
  build-and-chunk:
    permissions:
        contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-repart systemd-ukify

      - name: Grab Desync
        run: | 
          gh release download -R folbricht/desync -p "*_linux_amd64.tar.gz" -O - | tar -xzv
          chmod +x desync
          sudo mv desync /usr/local/bin/
      
      - name: Build OS Image
        run: |
          # Builds mkosi.output/my-os_1.0.0.raw
          sudo mkosi build
      
      - name: Chunk Image with Desync
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_UBUNTU_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          S3_ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          desync make \
            --store="s3://ubuntu/chunks/?endpoint=${R2_ENDPOINT}" \
            ./mybuntu.caibx \
            ./mkosi.output/mybuntu.raw

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          files: |
            ./mybuntu.caibx