name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:
  push:

jobs:
  CreateImage:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Registry and Image
        id: image_case
        run: |
          # Extract just the lowercased repository name for Buildah and Push
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Compute Release Tag
        id: vars
        run: |
          # Produces e.g. 2026.08.18-72 or v2026.08.18.72
          echo "RELEASE_TAG=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Install Dependencies
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-boot systemd-repart systemd-ukify python3-pefile binutils mtools dosfstools erofs-utils
     
      - name: Build OS Image
        run: |
          sudo mkosi build
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List directory
        run: |
          ls -la ./mkosi.output

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }} # optional if key has no passphrase

      - name: Rename release files
        run: |
          VER="${{ env.RELEASE_TAG }}"
         
          cp mkosi.output/*.efi "alma_${VER}.efi"
          cp mkosi.output/alma.raw "alma_image-x86-64_${VER}.raw"
          cp mkosi.output/alma.root-x86-64.raw "alma_root-x86-64_${VER}.raw"
          cp mkosi.output/alma.root-x86-64-verity.raw "alma_root-x86-64-verity_${VER}.raw"

          sha256sum "alma_${VER}.efi" "alma_image-x86-64_${VER}.raw" "alma_root-x86-64_${VER}.raw" "alma_root-x86-64-verity_${VER}.raw" > SHA256SUMS
          
          gpg --batch --yes --detach-sign --armor --output SHA256SUMS.gpg          

      - name: Clean-up Releases
        run: | 
          # Delete all pre-releases
          gh release list -L 500 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0:][].tagName' | xargs -r -I {} gh release delete {} --cleanup-tag -y

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.RELEASE_TAG }}"
          prerelease: false
          files: |
            ./alma_${{ env.RELEASE_TAG }}.efi
            ./alma_root-x86-64_${{ env.RELEASE_TAG }}.raw
            ./alma_root-x86-64-verity_${{ env.RELEASE_TAG }}.raw
            ./alma_image-x86-64_${{ env.RELEASE_TAG }}.raw
            SHA256SUMS
