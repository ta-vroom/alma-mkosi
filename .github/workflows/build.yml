name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:



jobs:
  build-and-chunk:
    permissions:
        contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-repart systemd-ukify

      - name: Grab Desync
        run: | 
          gh release download -R folbricht/desync -p "*_linux_amd64.tar.gz" -O - | tar -xzv
          chmod +x desync
          sudo mv desync /usr/local/bin/
      
      - name: Grab ORAS
        run: | 
          gh release download -R oras-project/oras -p "*_linux_amd64.tar.gz" -O - | tar -xzv
          chmod +x oras
          sudo mv oras /usr/local/bin/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OS Image
        run: |
          # Builds mkosi.output/my-os_1.0.0.raw
          sudo mkosi build
      
      - name: Chunk Image with Desync
        run: |
          mkdir -p ./chunk-store
          # Index file (.caibx) and chunk store output
          desync make \
            --store=./chunk-store \
            ./mybuntu.caibx \
            ./mkosi.output/mybuntu.raw

      - name: Push chunk store and index to GHCR using ORAS
        run: |
          oras push ghcr.io/${{ github.repository }}/chunks:latest \
          ./mybuntu.caibx:application/vnd.desync.index \
          ./chunk-store/:application/vnd.desync.chunkstore

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          files: |
            ./mybuntu.caibx