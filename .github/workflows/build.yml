name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:
  push:

jobs:
  build-and-chunk:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Registry and Image
        id: image_case
        run: |
          # Extract just the lowercased repository name for Buildah and Push
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Compute Release Tag
        id: vars
        run: |
          # Produces e.g. 2026.08.18-72 or v2026.08.18.72
          echo "RELEASE_TAG=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Install Dependencies
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-boot systemd-repart systemd-ukify python3-pefile binutils mtools dosfstools erofs-utils

      - name: Grab Desync
        run: | 
          gh release download -R folbricht/desync -p "*_linux_amd64.tar.gz" -O - | tar -xzv
          chmod +x desync
          sudo cp desync /usr/local/bin/
          mkdir -p mkosi.extra/usr/local/bin/
          cp desync mkosi.extra/usr/local/bin/
      
      - name: Build OS Image
        run: |
          sudo mkosi build
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chunk Images with Desync
        run: |
          STORE_URL="oci+https://ghcr.io/${{ steps.image_case.outputs.image }}"
          
          desync make \
            --store="${STORE_URL}" \
            ./alma.caibx \
            ./mkosi.output/alma.root-x86-64.raw
            
      - name: List directory
        run: |
          ls -la ./mkosi.output

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          prerelease: false
          files: |
            ./alma_${{ env.RELEASE_TAG }}.caibx