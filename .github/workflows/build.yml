name: Build

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on: 
  workflow_dispatch:
  push:

jobs:
  CreateImage:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute Release Tag
        id: vars
        run: |
          # Produces e.g. 2026.08.18-72 or v2026.08.18.72
          echo "RELEASE_TAG=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Install Dependencies
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y mkosi systemd-boot systemd-repart systemd-ukify python3-pefile binutils mtools dosfstools erofs-utils
     
      - name: Build OS Image
        env:
          SYSTEMD_REPART_MKFS_OPTIONS_EROFS: "-z zstd"
        run: |
          echo "${{ env.RELEASE_TAG }}" >> mkosi.version
          sudo -E mkosi build

      - name: List directory
        run: |
          ls -la ./mkosi.output
          
      - name: Sign and generate SHA256SUMS
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          
          sudo chown -R runner:runner ./mkosi.output

          VER="${{ env.RELEASE_TAG }}"
          
          mv ./mkosi.output/alma_${VER}.efi .
          mv ./mkosi.output/alma_${VER}.raw .
          mv ./mkosi.output/alma_${VER}.root-x86-64.raw .
          mv ./mkosi.output/alma_${VER}.root-x86-64-verity.raw .

          sha256sum alma_${VER}.* > SHA256SUMS
          
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor --output SHA256SUMS.gpg SHA256SUMS

      - name: Clean-up Releases
        run: | 
          # Delete all pre-releases
          gh release list -L 500 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0:][].tagName' | xargs -r -I {} gh release delete {} --cleanup-tag -y

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.RELEASE_TAG }}"
          prerelease: false
          files: |
            ./alma_*.efi
            ./alma_*.raw
            SHA256SUMS
            SHA256SUMS.gpg
