# Example 8: Multiple Ubuntu Releases via Profiles
#
# Demonstrates using mkosi profiles to build images for different
# Ubuntu releases from the same base configuration.
#
# Build Noble:  mkosi --profile noble
# Build Jammy:  mkosi --profile jammy
# Build Plucky: mkosi --profile plucky

[Distribution]
Distribution=ubuntu

[Output]
Format=directory

[Content]
Packages=
        systemd
        udev
        dbus
        openssh-server
        sudo
        ca-certificates
