# Example 3: Ubuntu Container Image
#
# A directory-format image optimized for use with systemd-nspawn.
# No kernel or bootloader - just the userspace. Lightweight and fast to build.
#
# Build:  mkosi
# Boot:   mkosi boot
# Shell:  mkosi shell
#
# You can also tar it up for use elsewhere:
#   Change Format=tar to get a tarball instead.

[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=directory

[Content]
# No kernel needed for containers
Bootable=no
Packages=
        systemd
        udev
        dbus
        iproute2
        iputils-ping
        openssh-server
        sudo
        curl
        less
        ca-certificates
        apt-utils
