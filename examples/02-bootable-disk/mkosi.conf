# Example 2: Bootable Ubuntu Disk Image
#
# A full GPT disk image with EFI boot support that can be:
# - Booted in qemu/KVM virtual machines
# - Written to a USB drive with `mkosi burn /dev/sdX`
# - Converted for use with other hypervisors
#
# Build:  mkosi
# Boot:   mkosi vm          (qemu virtual machine)
#         mkosi boot        (systemd-nspawn container)
# Write:  mkosi burn /dev/sdX

[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=disk

[Content]
Bootable=yes
Packages=
        systemd
        udev
        dbus
        linux-image-generic
        systemd-boot-efi
        networkmanager
        openssh-server
        openssh-client
        sudo
        less
        vim-tiny
        ca-certificates
