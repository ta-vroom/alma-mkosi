# Example 7: Ubuntu with Extra Files (mkosi.extra)
#
# Demonstrates using mkosi.extra/ to inject custom configuration files
# into the image. Files in mkosi.extra/ are copied into the image root
# after packages are installed.
#
# This is useful for:
#   - Custom sysctl settings
#   - systemd unit overrides
#   - /etc configuration files
#   - MOTD banners
#   - SSH authorized_keys
#
# Build:  mkosi
# Shell:  mkosi shell

[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=directory

[Content]
Packages=
        systemd
        udev
        dbus
        openssh-server
        sudo
        ca-certificates
