# Example 1: Minimal Ubuntu Server
#
# The simplest possible Ubuntu image - just systemd, networking, and SSH.
# Useful as a lightweight container or base for further customization.
#
# Build:  mkosi
# Boot:   mkosi boot     (systemd-nspawn container)
# Shell:  mkosi shell    (interactive shell without booting)

[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=directory

[Content]
Packages=
        systemd
        udev
        dbus
        iproute2
        iputils-ping
        openssh-server
        openssh-client
        sudo
        less
        ca-certificates
