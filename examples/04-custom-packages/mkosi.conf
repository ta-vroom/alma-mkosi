# Example 4: Ubuntu with Custom Packages
#
# Demonstrates enabling extra Ubuntu repositories (universe, multiverse)
# and installing a curated set of packages for a web server.
#
# Ubuntu repository components:
#   main       - Canonical-supported free software (always enabled)
#   universe   - Community-maintained free software
#   restricted - Proprietary drivers
#   multiverse - Software with usage restrictions
#
# Build:  mkosi
# Shell:  mkosi shell

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=universe,multiverse

[Output]
Format=directory

[Content]
Packages=
        systemd
        udev
        dbus
        iproute2
        # Web server stack
        nginx
        postgresql
        redis-server
        # Runtime
        python3
        python3-pip
        python3-venv
        # Monitoring & tools
        htop
        curl
        wget
        jq
        tmux
        git
        unzip
        ca-certificates
        sudo
