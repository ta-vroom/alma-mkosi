# Example 6: Ubuntu System Extension (sysext)
#
# Demonstrates building a system extension image that can be layered
# on top of a base Ubuntu image at runtime using systemd-sysext.
#
# This example builds:
#   1. A base Ubuntu image (directory format, with package metadata retained)
#   2. A Docker sysext that adds Docker on top of the base
#
# System extensions allow you to extend a read-only base OS with
# additional software without modifying the base image.
#
# Build:  mkosi
# The sysext image will be in mkosi.output/

[Output]
OutputDirectory=mkosi.output
