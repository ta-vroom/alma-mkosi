# Example 5: Ubuntu Development Image
#
# An image set up for C/C++ development, demonstrating mkosi's build
# script support. The build script compiles a sample project and installs
# it into the image.
#
# Key concepts:
#   - BuildPackages= installs build deps in an overlay (not in final image)
#   - mkosi.build.chroot runs inside the image to compile your project
#   - $SRCDIR points to your source code (mounted from host)
#   - $DESTDIR is where build output goes (installed into image)
#   - $BUILDDIR is a persistent build directory for incremental builds
#
# Build:  mkosi
# Shell:  mkosi shell

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=universe

[Output]
Format=directory

[Content]
Packages=
        systemd
        udev
        dbus
        sudo
        ca-certificates
        # Runtime libraries your project needs
        libcurl4

BuildPackages=
        gcc
        g++
        make
        cmake
        pkg-config
        libcurl4-openssl-dev
